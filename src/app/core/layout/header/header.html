<header class="header">
  <div class="header__inner container">
    <a class="header__brand" routerLink="/">{{ site.brand.name }}</a>

    <button
      type="button"
      class="header__toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-nav"
      (click)="toggle()"
    >
      <span class="visually-hidden">{{ menuOpen() ? 'Close menu' : 'Open menu' }}</span>
      <span class="header__bars" [class.header__bars--open]="menuOpen()" aria-hidden="true"></span>
    </button>

    <nav id="primary-nav" class="header__nav" [class.header__nav--open]="menuOpen()" aria-label="Primary">
      <ul class="header__list">
        @for (link of site.nav; track link.href) {
          <li>
            <a
              class="header__link"
              [routerLink]="link.href"
              routerLinkActive="header__link--active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: link.href === '/' }"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
